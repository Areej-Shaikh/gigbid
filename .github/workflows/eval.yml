name: eval

# 30-job smoke evaluation on every pull request (E2). Fails if bid-or-skip F1 drops, unsupported claims
# rise, scam recall drops or the simulated reply rate falls past evals/thresholds.json.
on:
  pull_request:
  workflow_dispatch:

jobs:
  smoke-eval:
    runs-on: ubuntu-latest
    env:
      LLM_PROFILE: fake          # deterministic and free; the Groq run is done locally (see evals/results)
      RAG_VARIANT: bm25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: grep -viE '^pywin32==' requirements.txt > /tmp/req.txt && pip install -r /tmp/req.txt
      - name: Smoke eval (30 dev jobs, stratified by style, simulated GigSim outcomes)
        run: python -m evals.runners.graph_eval --per-persona 10 --name smoke
      - name: Check thresholds
        run: python -m evals.runners.check_thresholds smoke
      - name: Summary
        if: always()
        run: cat evals/results/smoke_table.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-eval
          path: evals/results/smoke_*
