# Run everything locally:   docker compose -f infra/docker-compose.yml up --build
# Docker Compose v5 builds with Bake, which blocks reading Dockerfiles outside this folder. If the build
# says "additional privileges requested", set BUILDX_BAKE_ENTITLEMENTS_FS=0 first
#   (PowerShell: $env:BUILDX_BAKE_ENTITLEMENTS_FS="0"   bash: export BUILDX_BAKE_ENTITLEMENTS_FS=0)
# Then open http://localhost:8000 and sign in with a login from APP_USERS in .env.
#
# Secrets (GROQ_API_KEY, APP_SECRET, APP_USERS, MARKETPLACE_MCP_TOKENS) come from ../.env,
# never from the image. Redis and the worker are added in a later step.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gigbid
      POSTGRES_DB: gigbid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gigbid-local}   # local only; not published outside the compose network
    volumes:
      - gigbid-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gigbid -d gigbid"]
      interval: 30s
      start_period: 20s
      start_interval: 2s
      timeout: 3s
      retries: 5

  phoenix:                          # self-hosted tracing UI (E3): http://localhost:6006
    image: arizephoenix/phoenix:21.1.0
    environment:
      PHOENIX_ENABLE_AUTH: "false"    # local only; never expose this port publicly without auth
      PHOENIX_WORKING_DIR: /mnt/data
    ports: ["6006:6006"]
    volumes:
      - gigbid-traces:/mnt/data

  gigsim:
    build:
      context: ..
      dockerfile: infra/docker/gigsim.Dockerfile
    ports: ["8001:8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/docs', timeout=2)"]
      interval: 30s          # each check starts a Python process: keep it rare once healthy
      start_period: 30s
      start_interval: 2s     # check often only while starting, so the API starts quickly
      timeout: 3s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    env_file: ../.env
    environment:
      GIGSIM_URL: http://gigsim:8001
      START_GIGSIM: "0"
      # deployed retriever: BM25 had the best end-to-end bid F1 (evals/results/graph_rules_bm25_table.md)
      # and needs no model downloads; override with RAG_VARIANT=v2_hybrid to use hybrid retrieval
      RAG_VARIANT: ${DEPLOY_RAG_VARIANT:-bm25}
      # checkpoints (pending approvals) + long-term memory live in Postgres (C6)
      DATABASE_URL: postgresql://gigbid:${POSTGRES_PASSWORD:-gigbid-local}@postgres:5432/gigbid
      # tracing (E3): spans go to Phoenix; the run viewer links to the trace ("gigbid" = project 2 in a fresh Phoenix)
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://phoenix:6006/v1/traces
      TRACE_URL_TEMPLATE: http://localhost:6006/projects/UHJvamVjdDoy/traces/{trace_id}
    ports: ["8000:8000"]
    volumes:
      - gigbid-state:/app/data/processed    # small UI indexes + mock calendar
    depends_on:
      gigsim:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  gigbid-state:
  gigbid-pg:
  gigbid-traces:
